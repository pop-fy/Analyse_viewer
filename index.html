<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NCX Analysis Viewer</title>
<style>
  :root { --bg:#f7f8fa; --card:#fff; --text:#1c2230; --dim:#5b6475; --line:#e3e6ec; --accent:#2563eb;
          --b4:#15803d; --b3:#0e7490; --b2:#b45309; --b1:#be123c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0f141c; --card:#171d27; --text:#e6e9ef; --dim:#98a2b3;
          --line:#2a3240; --accent:#60a5fa; --b4:#4ade80; --b3:#22d3ee; --b2:#fbbf24; --b1:#fb7185; } }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:1.5rem; margin:0 0 4px; } p.sub { color:var(--dim); margin:0 0 16px; }
  input[type=search] { width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
          background:var(--card); color:var(--text); font:inherit; margin-bottom:12px; }
  .wrap { overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:10px; }
  table { width:100%; border-collapse:collapse; font-size:.92rem; }
  th, td { padding:9px 12px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
  th { color:var(--dim); font-weight:600; position:sticky; top:0; background:var(--card); }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; } td.total { font-weight:700; }
  a { color:var(--accent); font-weight:700; text-decoration:none; } a:hover { text-decoration:underline; }
  .miss { color:var(--dim); font-size:.8rem; }
  .band { font-weight:600; } .b4 { color:var(--b4); } .b3 { color:var(--b3); } .b2 { color:var(--b2); } .b1 { color:var(--b1); }
  .drop { border:2px dashed var(--line); border-radius:10px; padding:20px 16px; text-align:center; margin-bottom:16px; background:var(--card); }
  .drop.over { border-color:var(--accent); }
  .drop label { display:inline-block; margin:8px 4px 0; padding:8px 16px; border:1px solid var(--accent); border-radius:8px; color:var(--accent); font-weight:600; cursor:pointer; }
  .drop input { display:none; }
  #dash { position:fixed; inset:0; width:100%; height:100%; border:0; background:var(--bg); }
  #back { position:fixed; left:16px; bottom:16px; z-index:10; padding:10px 16px; border:0; border-radius:9999px;
          background:var(--accent); color:#fff; font:inherit; font-weight:700; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.25); }
</style></head><body>
<main id="list">
<h1>ผลประเมิน NCX Staff Exercise (Onsite)</h1>

<div class="drop" id="drop">
  ลากไฟล์ .md มาวางที่นี่ หรือ
  <label>เลือกไฟล์<input type="file" accept=".md" multiple></label>
  <label>เลือกทั้งโฟลเดอร์<input type="file" webkitdirectory></label>
  <div class="miss" id="errs"></div>
</div>
<input id="q" type="search" placeholder="ค้นหารหัสหรือชื่อหน่วยงาน..." oninput="for (const r of document.querySelectorAll('tbody tr')) r.hidden = !r.dataset.q.includes(this.value.trim().toLowerCase())">
<div class="wrap"><table>
<thead><tr><th>รหัส</th><th>หน่วยงาน</th><th class="num">D1</th><th class="num">D2</th><th class="num">D3</th><th class="num">D4</th><th class="num">รวม /80</th><th>ระดับ</th></tr></thead>
<tbody id="rows"></tbody></table></div>
</main>
<iframe id="dash" hidden title="Dashboard"></iframe>
<button id="back" hidden onclick="history.back()">← กลับหน้ารายการ</button>

 --bg-card: rgba(255, 255, 255, 0.85);\n      --bg-card-hover: #ffffff;\n      --border-color: rgba(0, 0, 0, 0.08);\n      --border-accent: rgba(59, 130, 246, 0.3);\n      --text-main: #0f172a;\n      --text-muted: #475569;\n      --text-dim: #94a3b8;\n      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);\n      --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.08);\n      --shadow-glow: 0 0 25px rgba(16, 185, 129, 0.1);\n    }\n\n    * {\n      box-sizing: border-box;\n      margin: 0;\n      padding: 0;\n      transition: background-color 0.25s ease, border-color 0.25s ease;\n    }\n\n    body {\n      background-color: var(--bg-primary);\n      color: var(--text-main);\n      font-family: var(--font-th);\n      line-height: 1.6;\n      -webkit-font-smoothing: antialiased;\n      min-height: 100vh;\n      background-image: \n        radial-gradient(at 10% 10%, rgba(59, 130, 246, 0.08) 0px, transparent 50%),\n        radial-gradient(at 90% 20%, rgba(16, 185, 129, 0.08) 0px, transparent 50%),\n        radial-gradient(at 50% 90%, rgba(139, 92, 246, 0.05) 0px, transparent 50%);\n      background-attachment: fixed;\n    }\n\n    .container {\n      max-width: 1380px;\n      margin: 0 auto;\n      padding: 28px 24px 80px 24px;\n    }\n\n    /* TOP BAR & ACTIONS */\n    .top-bar {\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      margin-bottom: 24px;\n      flex-wrap: wrap;\n      gap: 16px;\n    }\n    .badge-pill {\n      display: inline-flex;\n      align-items: center;\n      gap: 8px;\n      padding: 6px 14px;\n      border-radius: 9999px;\n      font-size: 0.85rem;\n      font-weight: 600;\n      background: rgba(16, 185, 129, 0.15);\n      color: var(--score-4);\n      border: 1px solid rgba(16, 185, 129, 0.3);\n    }\n    .badge-pill::before {\n      content: \"\";\n      width: 8px;\n      height: 8px;\n      border-radius: 50%;\n      background: var(--score-4);\n      box-shadow: 0 0 8px var(--score-4);\n    }\n    .actions-group {\n      display: flex;\n      gap: 12px;\n    }\n    .btn {\n      display: inline-flex;\n      align-items: center;\n      gap: 8px;\n      padding: 8px 16px;\n      border-radius: var(--radius-sm);\n      font-size: 0.9rem;\n      font-weight: 500;\n      cursor: pointer;\n      border: 1px solid var(--border-color);\n      background: var(--bg-secondary);\n      color: var(--text-main);\n      font-family: var(--font-th);\n      backdrop-filter: blur(8px);\n    }\n    .btn:hover {\n      background: var(--bg-card-hover);\n      border-color: var(--accent-blue);\n      transform: translateY(-1px);\n    }\n\n    /* HERO CARD */\n    .hero-card {\n      background: var(--bg-card);\n      backdrop-filter: blur(16px);\n      border: 1px solid var(--border-color);\n      border-radius: var(--radius-lg);\n      padding: 32px 36px;\n      margin-bottom: 32px;\n      box-shadow: var(--shadow-md);\n      position: relative;\n      overflow: hidden;\n    }\n    .hero-card::after {\n      content: \"\";\n      position: absolute;\n      top: -100px;\n      right: -100px;\n      width: 320px;\n      height: 320px;\n      background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 70%);\n      pointer-events: none;\n    }\n    .hero-header {\n      display: flex;\n      justify-content: space-between;\n      align-items: flex-start;\n      flex-wrap: wrap;\n      gap: 24px;\n    }\n    .hero-info {\n      max-width: 760px;\n    }\n    .hero-sub {\n      font-family: var(--font-en);\n      font-size: 0.9rem;\n      text-transform: uppercase;\n      letter-spacing: 0.08em;\n      color: var(--accent-cyan);\n      font-weight: 700;\n      margin-bottom: 6px;\n    }\n    .hero-title {\n      font-size: 2rem;\n      font-weight: 700;\n      color: var(--text-main);\n      margin-bottom: 8px;\n      line-height: 1.3;\n    }\n    .hero-desc {\n      color: var(--text-muted);\n      font-size: 1rem;\n      line-height: 1.6;\n    }\n    .hero-stats-badge {\n      display: flex;\n      flex-direction: column;\n      align-items: center;\n      justify-content: center;\n      background: linear-gradient(135deg, rgba(16, 185, 129, 0.12), rgba(6, 182, 212, 0.08));\n      border: 1px solid rgba(16, 185, 129, 0.35);\n      border-radius: var(--radius-md);\n      padding: 20px 28px;\n      min-width: 190px;\n      box-shadow: var(--shadow-glow);\n      text-align: center;\n    }\n    .hero-score-val {\n      font-family: var(--font-en);\n      font-size: 3rem;\n      font-weight: 800;\n      color: var(--accent-emerald);\n      line-height: 1;\n      margin-bottom: 4px;\n    }\n    .hero-score-max {\n      font-family: var(--font-en);\n      font-size: 1rem;\n      color: var(--text-muted);\n      font-weight: 600;\n      margin-bottom: 6px;\n    }\n    .hero-status-tag {\n      background: var(--accent-emerald);\n      color: #064e3b;\n      font-weight: 700;\n      font-size: 0.85rem;\n      padding: 4px 12px;\n      border-radius: 9999px;\n    }\n\n    /* KPI METRICS GRID */\n    .metrics-grid {\n      display: grid;\n      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));\n      gap: 20px;\n      margin-bottom: 32px;\n    }\n    .metric-card {\n      background: var(--bg-card);\n      backdrop-filter: blur(12px);\n      border: 1px solid var(--border-color);\n      border-radius: var(--radius-md);\n      padding: 22px;\n      box-shadow: var(--shadow-sm);\n      display: flex;\n      flex-direction: column;\n      justify-content: space-between;\n      position: relative;\n      cursor: pointer;\n    }\n    .metric-card:hover {\n      border-color: var(--border-accent);\n      transform: translateY(-2px);\n      box-shadow: var(--shadow-md);\n    }\n    .metric-top {\n      display: flex;\n      justify-content: space-between;\n      align-items: flex-start;\n      margin-bottom: 12px;\n    }\n    .metric-domain-name {\n      font-size: 0.95rem;\n      font-weight: 600;\n      color: var(--text-main);\n      max-width: 75%;\n    }\n    .metric-domain-id {\n      font-family: var(--font-en);\n      font-size: 0.75rem;\n      font-weight: 700;\n      color: var(--text-dim);\n      padding: 2px 6px;\n      background: rgba(255,255,255,0.05);\n      border-radius: 4px;\n    }\n    .metric-score-wrap {\n      display: flex;\n      align-items: baseline;\n      gap: 6px;\n      margin-bottom: 8px;\n    }\n    .metric-num {\n      font-family: var(--font-en);\n      font-size: 2.2rem;\n      font-weight: 800;\n      line-height: 1;\n    }\n    .metric-den {\n      font-family: var(--font-en);\n      font-size: 1rem;\n      color: var(--text-dim);\n      font-weight: 600;\n    }\n    .metric-grade {\n      margin-left: auto;\n      font-size: 0.85rem;\n      font-weight: 600;\n      padding: 3px 10px;\n      border-radius: 6px;\n    }\n    .grade-high {\n      background: rgba(16, 185, 129, 0.15);\n      color: var(--score-4);\n      border: 1px solid rgba(16, 185, 129, 0.3);\n    }\n    .grade-good {\n      background: rgba(6, 182, 212, 0.15);\n      color: var(--accent-cyan);\n      border: 1px solid rgba(6, 182, 212, 0.3);\n    }\n    .metric-progress-bg {\n      width: 100%;\n      height: 6px;\n      background: rgba(255, 255, 255, 0.08);\n      border-radius: 9999px;\n      overflow: hidden;\n      margin-top: 10px;\n    }\n    .metric-progress-bar {\n      height: 100%;\n      border-radius: 9999px;\n      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);\n    }\n\n    /* CHARTS SECTION */\n    .charts-row {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 24px;\n      margin-bottom: 32px;\n    }\n    @media (max-width: 992px) {\n      .charts-row {\n        grid-template-columns: 1fr;\n      }\n    }\n    .chart-box {\n      background: var(--bg-card);\n      backdrop-filter: blur(12px);\n      border: 1px solid var(--border-color);\n      border-radius: var(--radius-md);\n      padding: 24px;\n      box-shadow: var(--shadow-sm);\n    }\n    .chart-title-wrap {\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      margin-bottom: 18px;\n    }\n    .chart-title {\n      font-size: 1.1rem;\n      font-weight: 600;\n      color: var(--text-main);\n    }\n    .chart-canvas-container {\n      position: relative;\n      height: 290px;\n      width: 100%;\n    }\n\n    /* CONTROL BAR (FILTER, SEARCH, TABS) */\n    .controls-panel {\n      background: var(--bg-card);\n      backdrop-filter: blur(12px);\n      border: 1px solid var(--border-color);\n      border-radius: var(--radius-md);\n      padding: 18px 24px;\n      margin-bottom: 24px;\n      display: flex;\n      flex-direction: column;\n      gap: 16px;\n    }\n    .tabs-row {\n      display: flex;\n      gap: 8px;\n      overflow-x: auto;\n      padding-bottom: 4px;\n    }\n    .tab-btn {\n      padding: 8px 16px;\n      border-radius: 8px;\n      border: 1px solid transparent;\n      background: transparent;\n      color: var(--text-muted);\n      font-size: 0.9rem;\n      font-weight: 500;\n      font-family: var(--font-th);\n      cursor: pointer;\n      white-space: nowrap;\n    }\n    .tab-btn:hover {\n      color: var(--text-main);\n      background: rgba(255, 255, 255, 0.05);\n    }\n    .tab-btn.active {\n      color: var(--accent-blue);\n      background: rgba(59, 130, 246, 0.12);\n      border-color: rgba(59, 130, 246, 0.35);\n      font-weight: 600;\n    }\n    .filter-search-row {\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      flex-wrap: wrap;\n      gap: 16px;\n    }\n    .score-chips {\n      display: flex;\n      align-items: center;\n      gap: 8px;\n      flex-wrap: wrap;\n    }\n    .score-chip {\n      padding: 4px 12px;\n      border-radius: 9999px;\n      font-size: 0.8rem;\n      font-weight: 600;\n      cursor: pointer;\n      border: 1px solid var(--border-color);\n      background: var(--bg-secondary);\n      color: var(--text-muted);\n    }\n    .score-chip.active {\n      background: var(--text-main);\n      color: var(--bg-primary);\n      border-color: var(--text-main);\n    }\n    .search-input-wrap {\n      position: relative;\n      min-width: 280px;\n    }\n    .search-input {\n      width: 100%;\n      padding: 8px 14px 8px 36px;\n      border-radius: 8px;\n      border: 1px solid var(--border-color);\n      background: var(--bg-secondary);\n      color: var(--text-main);\n      font-family: var(--font-th);\n      font-size: 0.9rem;\n    }\n    .search-input:focus {\n      outline: none;\n      border-color: var(--accent-blue);\n      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);\n    }\n    .search-icon {\n      position: absolute;\n      left: 12px;\n      top: 50%;\n      transform: translateY(-50%);\n      color: var(--text-dim);\n      pointer-events: none;\n    }\n\n    /* DOMAIN DETAIL SECTION */\n    .domain-section {\n      margin-bottom: 36px;\n    }\n    .domain-header-card {\n      background: var(--bg-card);\n      backdrop-filter: blur(12px);\n      border: 1px solid var(--border-color);\n      border-radius: var(--radius-md) var(--radius-md) 0 0;\n      padding: 20px 24px;\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      border-bottom: 2px solid var(--border-color);\n    }\n    .domain-title-group h3 {\n      font-size: 1.25rem;\n      font-weight: 700;\n      color: var(--text-main);\n      display: flex;\n      align-items: center;\n      gap: 12px;\n    }\n    .domain-title-group p {\n      font-size: 0.85rem;\n      color: var(--text-muted);\n      margin-top: 2px;\n    }\n    .domain-score-pill {\n      font-family: var(--font-en);\n      font-size: 1.15rem;\n      font-weight: 800;\n      padding: 4px 14px;\n      border-radius: 9999px;\n      display: inline-flex;\n      align-items: baseline;\n      gap: 4px;\n    }\n\n    /* CRITERIA LIST */\n    .criteria-list {\n      display: flex;\n      flex-direction: column;\n      gap: 1px;\n      background: var(--border-color);\n      border-left: 1px solid var(--border-color);\n      border-right: 1px solid var(--border-color);\n    }\n    .criterion-item {\n      background: var(--bg-secondary);\n      padding: 20px 24px;\n      display: grid;\n      grid-template-columns: 56px 1fr 90px;\n      gap: 20px;\n      align-items: flex-start;\n      position: relative;\n    }\n    .criterion-item:hover {\n      background: var(--bg-card-hover);\n    }\n    .criterion-num {\n      font-family: var(--font-en);\n      font-size: 0.95rem;\n      font-weight: 700;\n      color: var(--text-dim);\n      background: rgba(255, 255, 255, 0.04);\n      width: 38px;\n      height: 38px;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      border-radius: 8px;\n    }\n    .criterion-body {\n      display: flex;\n      flex-direction: column;\n      gap: 10px;\n    }\n    .criterion-title {\n      font-size: 1.05rem;\n      font-weight: 600;\n      color: var(--text-main);\n    }\n    .evidence-quote {\n      background: rgba(255, 255, 255, 0.03);\n      border-left: 3px solid var(--accent-blue);\n      padding: 10px 14px;\n      border-radius: 0 6px 6px 0;\n      font-size: 0.9rem;\n      color: #cbd5e1;\n      font-style: italic;\n    }\n    [data-theme=\"light\"] .evidence-quote {\n      background: #f1f5f9;\n      color: #334155;\n    }\n    .evidence-quote strong {\n      font-weight: 600;\n      color: var(--text-main);\n    }\n    .rationale-text {\n      font-size: 0.92rem;\n      color: var(--text-muted);\n      line-height: 1.55;\n    }\n    .score-badge-circle {\n      width: 48px;\n      height: 48px;\n      border-radius: 50%;\n      display: flex;\n      flex-direction: column;\n      align-items: center;\n      justify-content: center;\n      font-family: var(--font-en);\n      font-weight: 800;\n      margin-left: auto;\n      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);\n    }\n    .score-badge-circle .sc-val {\n      font-size: 1.25rem;\n      line-height: 1;\n    }\n    .score-badge-circle .sc-sub {\n      font-size: 0.65rem;\n      opacity: 0.8;\n      font-weight: 600;\n    }\n\n    .badge-score-4 {\n      background: rgba(16, 185, 129, 0.18);\n      color: var(--score-4);\n      border: 1px solid rgba(16, 185, 129, 0.4);\n    }\n    .badge-score-3 {\n      background: rgba(6, 182, 212, 0.18);\n      color: var(--accent-cyan);\n      border: 1px solid rgba(6, 182, 212, 0.4);\n    }\n    .badge-score-2 {\n      background: rgba(245, 158, 11, 0.18);\n      color: var(--accent-amber);\n      border: 1px solid rgba(245, 158, 11, 0.4);\n    }\n    .badge-score-1 {\n      background: rgba(244, 63, 94, 0.18);\n      color: var(--accent-rose);\n      border: 1px solid rgba(244, 63, 94, 0.4);\n    }\n\n    /* STRENGTH & GAP FOOTER CARDS */\n    .domain-insights-grid {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 1px;\n      background: var(--border-color);\n      border: 1px solid var(--border-color);\n      border-top: none;\n      border-radius: 0 0 var(--radius-md) var(--radius-md);\n      overflow: hidden;\n    }\n    @media (max-width: 768px) {\n      .domain-insights-grid {\n        grid-template-columns: 1fr;\n      }\n      .criterion-item {\n        grid-template-columns: 36px 1fr 60px;\n        gap: 12px;\n        padding: 16px;\n      }\n    }\n    .insight-card {\n      background: var(--bg-card);\n      padding: 18px 24px;\n    }\n    .insight-label {\n      display: flex;\n      align-items: center;\n      gap: 8px;\n      font-size: 0.85rem;\n      font-weight: 700;\n      text-transform: uppercase;\n      letter-spacing: 0.05em;\n      margin-bottom: 8px;\n    }\n    .insight-label.strength {\n      color: var(--score-4);\n    }\n    .insight-label.gap {\n      color: var(--score-2);\n    }\n    .insight-desc {\n      font-size: 0.92rem;\n      color: var(--text-muted);\n      line-height: 1.55;\n    }\n\n    /* CALLOUT BANNER / LIMITATIONS */\n    .info-callout {\n      background: rgba(59, 130, 246, 0.08);\n      border: 1px solid rgba(59, 130, 246, 0.25);\n      border-radius: var(--radius-md);\n      padding: 20px 24px;\n      margin-top: 36px;\n      display: flex;\n      gap: 18px;\n      align-items: flex-start;\n    }\n    .callout-icon {\n      font-size: 1.5rem;\n      line-height: 1;\n      color: var(--accent-cyan);\n    }\n    .callout-title {\n      font-weight: 700;\n      color: var(--text-main);\n      margin-bottom: 4px;\n      font-size: 1rem;\n    }\n    .callout-text {\n      font-size: 0.9rem;\n      color: var(--text-muted);\n    }\n\n    /* MODAL */\n    .modal-overlay {\n      position: fixed;\n      top: 0;\n      left: 0;\n      right: 0;\n      bottom: 0;\n      background: rgba(0, 0, 0, 0.75);\n      backdrop-filter: blur(6px);\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      z-index: 999;\n      opacity: 0;\n      pointer-events: none;\n      transition: opacity 0.25s ease;\n      padding: 20px;\n    }\n    .modal-overlay.open {\n      opacity: 1;\n      pointer-events: auto;\n    }\n    .modal-container {\n      background: var(--bg-secondary);\n      border: 1px solid var(--border-color);\n      border-radius: var(--radius-lg);\n      max-width: 680px;\n      width: 100%;\n      max-height: 85vh;\n      overflow-y: auto;\n      padding: 28px;\n      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);\n    }\n    .modal-header {\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      margin-bottom: 20px;\n      border-bottom: 1px solid var(--border-color);\n      padding-bottom: 14px;\n    }\n    .modal-title {\n      font-size: 1.25rem;\n      font-weight: 700;\n      color: var(--text-main);\n    }\n    .modal-close {\n      background: none;\n      border: none;\n      color: var(--text-dim);\n      font-size: 1.5rem;\n      cursor: pointer;\n      line-height: 1;\n    }\n    .modal-close:hover {\n      color: var(--text-main);\n    }\n    .rubric-table {\n      width: 100%;\n      border-collapse: collapse;\n      margin-top: 12px;\n    }\n    .rubric-table th, .rubric-table td {\n      padding: 10px 14px;\n      text-align: left;\n      border-bottom: 1px solid var(--border-color);\n      font-size: 0.9rem;\n    }\n    .rubric-table th {\n      color: var(--text-muted);\n      font-weight: 600;\n    }\n\n    /* FOOTER */\n    footer {\n      margin-top: 48px;\n      text-align: center;\n      color: var(--text-dim);\n      font-size: 0.85rem;\n      border-top: 1px solid var(--border-color);\n      padding-top: 24px;\n    }\n\n    /* PRINT STYLES */\n    @media print {\n      body {\n        background: #ffffff !important;\n        color: #000000 !important;\n      }\n      .actions-group, .controls-panel, .btn, .modal-overlay {\n        display: none !important;\n      }\n      .hero-card, .metric-card, .chart-box, .criterion-item, .insight-card {\n        background: #ffffff !important;\n        border: 1px solid #ccc !important;\n        box-shadow: none !important;\n        color: #000000 !important;\n      }\n      .container {\n        padding: 0;\n        max-width: 100%;\n      }\n      .domain-section {\n        page-break-inside: avoid;\n      }\n    }\n    .badge-score-0 { background: rgba(107,114,128,0.18); color: var(--score-0); border: 1px solid rgba(107,114,128,0.4); }\n\n    .ref-chip { font-family: var(--font-en); font-size: 0.78rem; font-weight: 700; padding: 1px 8px; margin: 0 2px; border-radius: 9999px;\n      border: 1px solid var(--border-accent); background: rgba(59,130,246,0.12); color: var(--accent-blue); cursor: pointer; }\n    .ref-chip:hover, .ref-chip.active { background: var(--accent-blue); color: #fff; }\n    .ref-chip.missing { border-color: var(--accent-rose); color: var(--accent-rose); background: transparent; cursor: not-allowed; }\n    .raw-panel { border: 1px solid var(--border-accent); border-radius: 8px; background: var(--bg-card); padding: 12px 14px; font-size: 0.88rem; }\n    .raw-head { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; color: var(--text-main); margin-bottom: 8px; }\n    .raw-head button { background: none; border: none; color: var(--text-dim); font-size: 1.2rem; cursor: pointer; line-height: 1; }\n    .raw-label { font-size: 0.75rem; font-weight: 700; color: var(--accent-cyan); text-transform: uppercase; letter-spacing: 0.04em; margin: 8px 0 4px; }\n    .raw-text { white-space: pre-wrap; font-family: var(--font-th); color: var(--text-muted); max-height: 360px; overflow: auto; margin: 0; }\n    .raw-panel summary { cursor: pointer; color: var(--text-dim); margin-top: 8px; }\n  \u003c/style>\n\u003c/head>\n\u003cbody data-theme=\"dark\">\n\n  \u003cdiv class=\"container\">\n    \u003c!-- TOP ACTIONS -->\n    \u003cheader class=\"top-bar\">\n      \u003cdiv style=\"display: flex; align-items: center; gap: 12px; flex-wrap: wrap;\">\n        \u003cspan class=\"badge-pill\">Staff-Exercise (กิจกรรมที่ 2)\u003c/span>\n        \u003cspan style=\"font-size: 0.85rem; color: var(--text-muted);\">หน่วยงาน __CODE__ (Onsite) · __NAME__\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"actions-group\">\n        \u003cbutton class=\"btn\" onclick=\"openRubricModal()\">\n          \u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003cpath d=\"M12 20h9\"/>\u003cpath d=\"M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z\"/>\u003c/svg>\n          เกณฑ์การประเมิน\n        \u003c/button>\n        \u003cbutton class=\"btn\" onclick=\"toggleTheme()\" id=\"themeBtn\">\n          \u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003ccircle cx=\"12\" cy=\"12\" r=\"5\"/>\u003cpath d=\"M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42\"/>\u003c/svg>\n          โหมดแสดงผล\n        \u003c/button>\n        \u003cbutton class=\"btn\" onclick=\"window.print()\">\n          \u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003cpolyline points=\"6 9 6 2 18 2 18 9\"/>\u003cpath d=\"M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2\"/>\u003crect x=\"6\" y=\"14\" width=\"12\" height=\"8\"/>\u003c/svg>\n          พิมพ์รายงาน\n        \u003c/button>\n      \u003c/div>\n    \u003c/header>\n\n    ", "tail": "\u003c!-- RUBRIC MODAL -->\n  \u003cdiv class=\"modal-overlay\" id=\"rubricModal\" onclick=\"closeRubricModal(event)\">\n    \u003cdiv class=\"modal-container\" onclick=\"event.stopPropagation()\">\n      \u003cdiv class=\"modal-header\">\n        \u003ch3 class=\"modal-title\">เกณฑ์ระดับคะแนนการประเมิน (Scoring Rubric)\u003c/h3>\n        \u003cbutton class=\"modal-close\" onclick=\"closeRubricModal()\">&times;\u003c/button>\n      \u003c/div>\n      \u003cp style=\"color: var(--text-muted); font-size: 0.9rem; margin-bottom: 16px;\">\n        อ้างอิงตามเกณฑ์การประเมินผลการฝึก staff-exercise (0-4 คะแนนต่อหัวข้อ, 5 หัวข้อต่อสมรรถนะ, เต็ม 20 คะแนนต่อด้าน)\n      \u003c/p>\n      \u003ctable class=\"rubric-table\">\n        \u003cthead>\n          \u003ctr>\n            \u003cth style=\"width: 70px;\">คะแนน\u003c/th>\n            \u003cth style=\"width: 130px;\">ระดับคุณภาพ\u003c/th>\n            \u003cth>คำอธิบายเกณฑ์การให้คะแนน\u003c/th>\n          \u003c/tr>\n        \u003c/thead>\n        \u003ctbody>\n          \u003ctr>\n            \u003ctd>\u003cstrong style=\"color: var(--score-4); font-size: 1.1rem;\">4\u003c/strong>\u003c/td>\n            \u003ctd style=\"color: var(--score-4); font-weight: 600;\">ครบถ้วนสมบูรณ์\u003c/td>\n            \u003ctd>มีองค์ประกอบสำคัญครบถ้วน ชัดเจน เป็นรูปธรรม มีหลักฐานอ้างอิงและแนวปฏิบัติที่ปฏิบัติได้จริง\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>\u003cstrong style=\"color: var(--accent-cyan); font-size: 1.1rem;\">3\u003c/strong>\u003c/td>\n            \u003ctd style=\"color: var(--accent-cyan); font-weight: 600;\">ดี\u003c/td>\n            \u003ctd>พบ 3 ใน 4 ส่วนขององค์ประกอบ ขาดรายละเอียดปลีกย่อยเล็กน้อย\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>\u003cstrong style=\"color: var(--accent-amber); font-size: 1.1rem;\">2\u003c/strong>\u003c/td>\n            \u003ctd style=\"color: var(--accent-amber); font-weight: 600;\">พอใช้ / มีช่องว่าง\u003c/td>\n            \u003ctd>พบ 2 ส่วนขององค์ประกอบ มีช่องว่างที่จำเป็นต้องได้รับการพัฒนาหรือระบุไม่ชัดเจน\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>\u003cstrong style=\"color: var(--accent-rose); font-size: 1.1rem;\">1\u003c/strong>\u003c/td>\n            \u003ctd style=\"color: var(--accent-rose); font-weight: 600;\">ต้องปรับปรุง\u003c/td>\n            \u003ctd>พบเพียง 1 ส่วนหรือตอบในเชิงกล่าวทั่วไป ขาดข้อมูลสนับสนุนเชิงรูปธรรม\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>\u003cstrong style=\"color: var(--score-0); font-size: 1.1rem;\">0\u003c/strong>\u003c/td>\n            \u003ctd style=\"color: var(--score-0); font-weight: 600;\">ไม่ผ่านเกณฑ์\u003c/td>\n            \u003ctd>ไม่ปรากฏข้อมูล ไม่ตอบคำถาม หรือเนื้อหาไม่สอดคล้องกับหัวข้อประเมิน\u003c/td>\n          \u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cscript>\n    // State\n    let currentDomain = 'all';\n    let currentScoreFilter = 'all';\n    let searchQuery = '';\n\n    // Initialize Charts\n    let radarChartInst = null;\n    let distChartInst = null;\n\n    function initCharts() {\n      const isDark = document.body.getAttribute('data-theme') === 'dark';\n      const textColor = isDark ? '#9ca3af' : '#475569';\n      const gridColor = isDark ? 'rgba(255, 255, 255, 0.08)' : 'rgba(0, 0, 0, 0.06)';\n\n      // Radar Chart\n      const ctxRadar = document.getElementById('radarChart').getContext('2d');\n      radarChartInst = new Chart(ctxRadar, {\n        type: 'radar',\n        data: {\n          labels: [\n            '1. Impact Analysis',\n            '2. Crisis Declaration',\n            '3. Containment Strategy',\n            '4. Crisis Communication'\n          ],\n          datasets: [\n            {\n              label: 'คะแนนที่ได้ (Actual)',\n              data: __SUMS__,\n              backgroundColor: 'rgba(16, 185, 129, 0.25)',\n              borderColor: '#10b981',\n              borderWidth: 2,\n              pointBackgroundColor: '#10b981',\n              pointBorderColor: '#ffffff',\n              pointRadius: 4,\n              pointHoverRadius: 6\n            },\n            {\n              label: 'คะแนนเต็ม (Max 20)',\n              data: [20, 20, 20, 20],\n              backgroundColor: 'transparent',\n              borderColor: isDark ? 'rgba(255, 255, 255, 0.2)' : 'rgba(0, 0, 0, 0.15)',\n              borderWidth: 1.5,\n              borderDash: [4, 4],\n              pointRadius: 0\n            }\n          ]\n        },\n        options: {\n          responsive: true,\n          maintainAspectRatio: false,\n          scales: {\n            r: {\n              angleLines: { color: gridColor },\n              grid: { color: gridColor },\n              pointLabels: {\n                color: isDark ? '#e5e7eb' : '#1f2937',\n                font: { family: \"'Sarabun', sans-serif\", size: 12, weight: 600 }\n              },\n              suggestedMin: 0,\n              suggestedMax: 20,\n              ticks: { stepSize: 5, color: textColor, backdropColor: 'transparent' }\n            }\n          },\n          plugins: {\n            legend: {\n              position: 'bottom',\n              labels: {\n                color: textColor,\n                font: { family: \"'Sarabun', sans-serif\", size: 12 }\n              }\n            }\n          }\n        }\n      });\n\n      // Distribution Bar Chart\n      const ctxDist = document.getElementById('distChart').getContext('2d');\n      distChartInst = new Chart(ctxDist, {\n        type: 'bar',\n        data: {\n          labels: ['4 คะแนน (ครบถ้วน)', '3 คะแนน (ดี)', '2 คะแนน (มีช่องว่าง)', '1 คะแนน (ปรับปรุง)', '0 คะแนน'],\n          datasets: [{\n            label: 'จำนวนหัวข้อ',\n            data: __DIST__,\n            backgroundColor: [\n              '#10b981',\n              '#06b6d4',\n              '#f59e0b',\n              '#f43f5e',\n              '#6b7280'\n            ],\n            borderRadius: 6,\n            maxBarThickness: 42\n          }]\n        },\n        options: {\n          responsive: true,\n          maintainAspectRatio: false,\n          scales: {\n            x: {\n              grid: { display: false },\n              ticks: { color: textColor, font: { family: \"'Sarabun', sans-serif\", size: 11 } }\n            },\n            y: {\n              grid: { color: gridColor },\n              ticks: { stepSize: 2, color: textColor },\n              beginAtZero: true\n            }\n          },\n          plugins: {\n            legend: { display: false },\n            tooltip: {\n              callbacks: {\n                label: (ctx) => ` จำนวน: ${ctx.raw} หัวข้อ (${((ctx.raw/20)*100).toFixed(0)}%)`\n              }\n            }\n          }\n        }\n      });\n    }\n\n    // Filter by Domain\n    function filterByDomain(domain) {\n      currentDomain = domain;\n      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));\n      const activeIdx = domain === 'all' ? 0 : parseInt(domain.replace('d', ''));\n      const buttons = document.querySelectorAll('.tab-btn');\n      if (buttons[activeIdx]) buttons[activeIdx].classList.add('active');\n\n      applyFilters();\n    }\n\n    // Filter by Score\n    function filterByScore(score) {\n      currentScoreFilter = score;\n      document.querySelectorAll('.score-chip').forEach(chip => chip.classList.remove('active'));\n      event.target.classList.add('active');\n      applyFilters();\n    }\n\n    // Search\n    function handleSearch() {\n      searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();\n      applyFilters();\n    }\n\n    // Combined filter function\n    function applyFilters() {\n      const sections = document.querySelectorAll('.domain-section');\n\n      sections.forEach(section => {\n        const secDomain = section.getAttribute('data-domain');\n        const matchesDomain = currentDomain === 'all' || currentDomain === secDomain;\n\n        if (!matchesDomain) {\n          section.style.display = 'none';\n          return;\n        }\n\n        // Filter individual items within section\n        const items = section.querySelectorAll('.criterion-item');\n        let visibleCount = 0;\n\n        items.forEach(item => {\n          const score = item.getAttribute('data-score');\n          const matchesScore = currentScoreFilter === 'all' || currentScoreFilter === score;\n          \n          const textContent = item.textContent.toLowerCase();\n          const matchesSearch = !searchQuery || textContent.includes(searchQuery);\n\n          if (matchesScore && matchesSearch) {\n            item.style.display = 'grid';\n            visibleCount++;\n          } else {\n            item.style.display = 'none';\n          }\n        });\n\n        // Hide section entirely if no items match\n        if (visibleCount > 0) {\n          section.style.display = 'block';\n        } else {\n          section.style.display = 'none';\n        }\n      });\n    }\n\n    // Theme Toggle\n    function toggleTheme() {\n      const body = document.body;\n      const current = body.getAttribute('data-theme');\n      const next = current === 'dark' ? 'light' : 'dark';\n      body.setAttribute('data-theme', next);\n\n      // Re-render charts for theme colors\n      if (radarChartInst && distChartInst) {\n        radarChartInst.destroy();\n        distChartInst.destroy();\n        initCharts();\n      }\n    }\n\n    // Rubric Modal\n    function openRubricModal() {\n      document.getElementById('rubricModal').classList.add('open');\n    }\n    function closeRubricModal(e) {\n      document.getElementById('rubricModal').classList.remove('open');\n    }\n\n    // Close modal on Escape\n    document.addEventListener('keydown', (e) => {\n      if (e.key === 'Escape') closeRubricModal();\n    });\n\n    // Boot\n    window.addEventListener('DOMContentLoaded', () => {\n      initCharts();\n    });\n  \u003c/script>\n  \u003cscript type=\"application/json\" id=\"rawData\">__RAW__\u003c/script>\n  \u003cscript>\n    // Expand RAW activity text when a (กิจกรรม N) reference chip is clicked\n    const RAW = JSON.parse(document.getElementById('rawData').textContent);\n    function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }\n    document.addEventListener('click', (e) => {\n      const chip = e.target.closest('.ref-chip');\n      if (!chip || chip.classList.contains('missing')) return;\n      const body = chip.closest('.criterion-body');\n      const panel = body.querySelector('.raw-panel');\n      const n = chip.dataset.act;\n      body.querySelectorAll('.ref-chip').forEach(c => c.classList.remove('active'));\n      if (!panel.hidden && panel.dataset.act === n) { panel.hidden = true; return; }\n      const a = RAW[n];\n      panel.replaceChildren();\n      const head = el('div', 'raw-head');\n      head.append(el('span', null, `กิจกรรม ${n} · ${a.time} · ${a.subject}`));\n      const close = el('button', null, '×'); close.title = 'ปิด';\n      close.onclick = () => { panel.hidden = true; chip.classList.remove('active'); };\n      head.append(close);\n      panel.append(head, el('div', 'raw-label', 'คำตอบของหน่วยงาน'), el('pre', 'raw-text', a.reply || '(ไม่มีข้อความ)'));\n      if (a.attachment) panel.append(el('div', 'raw-label', 'ไฟล์แนบ: ' + a.attachment));\n      if (a.inject) {\n        const d = el('details'); d.append(el('summary', null, 'แสดงโจทย์ที่ได้รับ (Inject)'), el('pre', 'raw-text', a.inject));\n        panel.append(d);\n      }\n      panel.dataset.act = n; panel.hidden = false; chip.classList.add('active');\n    });\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"};

// ── same rendering rules as scripts/build_dashboard.py ──
const SHORT = ['Impact Analysis', 'Crisis Declaration', 'Containment Strategy', 'Crisis Communication'];
const CARD = ['การประเมินผลกระทบ (Impact Analysis)', 'การประกาศวิกฤติและสั่งการ (Crisis Declaration)',
  'กลยุทธ์ควบคุมเหตุการณ์ (Containment Strategy)', 'การสื่อสารในภาวะวิกฤติ (Crisis Communication)'];
const CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>';
const ALERT = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
const BAND = { 'ดีมาก': 'b4', 'ดี': 'b3', 'พอใช้': 'b2', 'ควรปรับปรุง': 'b1' };

function grade(s) {  // ดีมาก 16-20 · ดี 11-15 · พอใช้ 6-10 · ควรปรับปรุง 0-5
  if (s >= 16) return ['ดีมาก', 'grade-high', 'var(--score-4)'];
  if (s >= 11) return ['ดี', 'grade-good', 'var(--accent-cyan)'];
  if (s >= 6) return ['พอใช้', 'badge-score-2', 'var(--accent-amber)'];
  return ['ควรปรับปรุง', 'badge-score-1', 'var(--accent-rose)'];
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fill = (s, map) => Object.entries(map).reduce((t, [k, v]) => t.split(k).join(v), s);  // no $-pattern surprises

function expand(spec) {  // '1–4, 7' -> [1,2,3,4,7]
  return spec.trim().split(/\s*,\s*/).flatMap(p => {
    const m = p.match(/^(\d+)\s*[–-]\s*(\d+)$/);
    return m ? Array.from({ length: m[2] - m[1] + 1 }, (_, i) => +m[1] + i) : [+p];
  });
}
const linkRefs = (text, acts) => text.replace(/กิจกรรม\s+(\d+(?:\s*[,–-]\s*\d+)*)/g, (_, spec) => 'กิจกรรม ' + expand(spec).map(n => acts[n]
  ? `<button type="button" class="ref-chip" data-act="${n}" title="${esc(acts[n].time)}">${n}</button>`
  : `<button type="button" class="ref-chip missing" title="ไม่พบใน RAW">${n}</button>`).join(''));

// ── analysis_<CODE>.md -> eval-like object ──
function parseMd(text, fname) {
  text = text.replace(/\r\n/g, '\n');
  const [body, rawPart = ''] = text.split('\n## ข้อมูลกิจกรรมดิบ');
  const field = (k, s = body) => (s.match(new RegExp(`\\*\\*${k}:\\*\\*[ \\t]*([^\\n]*)`)) || [])[1]?.trim() || '';
  const j = rawPart.match(/```json\n([\s\S]*)\n```/);
  const domains = body.split(/^### ด้านที่ \d+: /m).slice(1).map(sec => ({
    title: sec.split('\n')[0].trim(),
    desc: ((sec.match(/^คะแนนรวม:.*$/m) || [''])[0]).replace(/\*\*/g, ''),
    strength: (sec.match(/\*\*จุดแข็ง:\s*(.*?)\*\*/) || [])[1] || '',
    gap: (sec.match(/\*\*จุดที่ควรพัฒนา:\s*(.*?)\*\*/) || [])[1] || '',
    items: sec.split(/^#### /m).slice(1).map(it => ({
      t: it.split('\n')[0].trim(), s: +(it.match(/\*\*คะแนน:\*\*\s*(\d)\s*\//) || [])[1],
      q: field('หลักฐาน', it), r: field('เหตุผล', it),
    })),
  }));
  if (domains.length !== 4 || domains.some(d => d.items.length !== 5 || d.items.some(i => !(i.s >= 0 && i.s <= 4))))
    throw new Error('รูปแบบไม่ใช่ไฟล์ผลวิเคราะห์ (ต้องมี 4 ด้าน × 5 ข้อ)');
  const sums = domains.map(d => d.items.reduce((a, i) => a + i.s, 0));
  return {
    code: field('รหัสหน่วยงาน') || fname.replace(/^analysis_|\.md$/g, ''), name: field('ชื่อหน่วยงาน'),
    raw_file: field('ไฟล์ RAW'), hero_desc: (body.match(/^> (.*)$/m) || [])[1] || '',
    overall: (body.match(/## ข้อเสนอแนะโดยรวม\s*\n+([^\n]+)/) || [])[1] || '',
    acts: j ? JSON.parse(j[1]) : {}, domains, sums, total: sums.reduce((a, b) => a + b, 0),
  };
}

// ── eval-like object -> full dashboard HTML (port of build_dashboard.build) ──
function buildHtml(ev) {
  const { code, domains: doms, sums, total, acts } = ev;
  const pct = (total / 80 * 100).toFixed(1);
  const dist = [4, 3, 2, 1, 0].map(s => doms.flatMap(d => d.items).filter(i => i.s === s).length);
  const [band, , bandCol] = grade(total / 4);
  const o = [`<!-- HERO SECTION -->
    <section class="hero-card"><div class="hero-header">
      <div class="hero-info">
        <div class="hero-sub">Cyber Competency Evaluation Report</div>
        <h1 class="hero-title">รายงานผลการประเมินสมรรถนะหลักด้านความมั่นคงปลอดภัยไซเบอร์</h1>
        <p class="hero-desc">${esc(ev.hero_desc)}</p>
      </div>
      <div class="hero-stats-badge">
        <div class="hero-score-val" id="totalScoreCount">${total}</div>
        <div class="hero-score-max">เต็ม 80 คะแนน (${pct}%)</div>
        <div class="hero-status-tag" style="background: ${bandCol};">ระดับสมรรถนะ: ${band}</div>
        <div class="hero-score-max" style="margin-top: 8px; font-size: 0.8rem;">ยังไม่รวมคะแนนเข้าร่วม 20 คะแนน</div>
      </div>
    </div></section>
    <section class="metrics-grid">`];
  sums.forEach((s, i) => {
    const [lbl, cls, col] = grade(s), n = i + 1;
    o.push(`
      <div class="metric-card" onclick="filterByDomain('d${n}')">
        <div class="metric-top"><div class="metric-domain-name">${n}. ${CARD[i]}</div><span class="metric-domain-id">D${n}</span></div>
        <div class="metric-score-wrap"><span class="metric-num" style="color: ${col};">${s}</span><span class="metric-den">/ 20</span>
          <span class="metric-grade ${cls}">${lbl} (${s * 5}%)</span></div>
        <div class="metric-progress-bg"><div class="metric-progress-bar" style="width: ${s * 5}%; background: ${col};"></div></div>
      </div>`);
  });
  o.push(`
    </section>
    <section class="charts-row">
      <div class="chart-box">
        <div class="chart-title-wrap"><h3 class="chart-title">ภาพรวมสมรรถนะเปรียบเทียบค่าเป้าหมาย (Radar Analysis)</h3>
          <span style="font-size: 0.8rem; color: var(--text-dim);">คะแนนเต็มสมรรถนะละ 20</span></div>
        <div class="chart-canvas-container"><canvas id="radarChart"></canvas></div>
      </div>
      <div class="chart-box">
        <div class="chart-title-wrap"><h3 class="chart-title">การกระจายตัวของระดับคะแนนรายเกณฑ์ (Score Breakdown)</h3>
          <span style="font-size: 0.8rem; color: var(--text-dim);">ทั้งหมด 20 ข้อย่อย</span></div>
        <div class="chart-canvas-container"><canvas id="distChart"></canvas></div>
      </div>
    </section>
    <section class="controls-panel">
      <div class="tabs-row">
        <button class="tab-btn active" onclick="filterByDomain('all')">ทั้งหมด (All Domains)</button>
        ${sums.map((s, i) => `<button class="tab-btn" onclick="filterByDomain('d${i + 1}')">${i + 1}. ${SHORT[i]} (${s}/20)</button>`).join('\n        ')}
      </div>
      <div class="filter-search-row">
        <div class="score-chips">
          <span style="font-size: 0.85rem; color: var(--text-dim); margin-right: 4px;">กรองตามคะแนน:</span>
          <button class="score-chip active" onclick="filterByScore('all')">ทั้งหมด (20)</button>
          ${[4, 3, 2, 1, 0].map((s, i) => dist[i] ? `<button class="score-chip" onclick="filterByScore('${s}')">${s === 4 ? 'คะแนนเต็ม 4' : 'คะแนน ' + s} (${dist[i]})</button>` : '').join('')}
        </div>
        <div class="search-input-wrap">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="searchInput" class="search-input" placeholder="ค้นหาหัวข้อ, เหตุผล, ข้อความหลักฐาน..." oninput="handleSearch()">
        </div>
      </div>
    </section>`);
  doms.forEach((d, i) => {
    const n = i + 1, s = sums[i];
    o.push(`
    <section class="domain-section" id="domain-d${n}" data-domain="d${n}">
      <div class="domain-header-card">
        <div class="domain-title-group"><h3><span>สมรรถนะด้านที่ ${n}: ${esc(d.title)}</span></h3><p>${esc(d.desc)}</p></div>
        <div class="domain-score-pill ${grade(s)[1]}">${s} <span style="font-size: 0.8rem; font-weight: normal; color: var(--text-muted);">/ 20</span></div>
      </div>
      <div class="criteria-list">${d.items.map((it, k) => `
        <div class="criterion-item" data-score="${it.s}">
          <div class="criterion-num">${n}.${k + 1}</div>
          <div class="criterion-body">
            <h4 class="criterion-title">${esc(it.t)}</h4>
            <div class="evidence-quote">${esc(it.q)}</div>
            <p class="rationale-text"><strong>เหตุผลและหลักฐาน:</strong> ${linkRefs(esc(it.r), acts)}</p>
            <div class="raw-panel" hidden></div>
          </div>
          <div class="score-badge-circle badge-score-${it.s}"><span class="sc-val">${it.s}</span><span class="sc-sub">เต็ม 4</span></div>
        </div>`).join('')}
      </div>
      <div class="domain-insights-grid">
        <div class="insight-card"><div class="insight-label strength">${CHECK} จุดแข็งและแนวปฏิบัติที่ดี</div><p class="insight-desc">${esc(d.strength)}</p></div>
        <div class="insight-card"><div class="insight-label gap">${ALERT} ช่องว่างและข้อเสนอแนะในการปรับปรุง</div><p class="insight-desc">${esc(d.gap)}</p></div>
      </div>
    </section>`);
  });
  o.push(`
    <div class="info-callout">
      <div class="callout-icon">ℹ️</div>
      <div>
        <h4 class="callout-title">ข้อจำกัดและหมายเหตุประกอบรายงานการประเมิน</h4>
        <p class="callout-text">
          1. <strong>เกณฑ์การตัดสิน:</strong> คะแนนหมวดสมรรถนะหลัก ${total}/80 (${pct}%) — ประกาศนียบัตรองค์กรพิจารณาจากคะแนนกิจกรรมที่ 1 และ 2 รวมกันไม่น้อยกว่าร้อยละ 70 (กิจกรรมที่ 2 = เข้าร่วม 20 จากระบบลงทะเบียน + สมรรถนะ 80) จึงยังสรุปผ่าน/ไม่ผ่านจากหน้านี้ไม่ได้<br>
          2. <strong>ข้อเสนอแนะโดยรวม:</strong> ${esc(ev.overall) || '-'}<br>
          3. <strong>แหล่งข้อมูล:</strong> ประเมินจาก ${esc(ev.raw_file)} — ${Object.keys(acts).length ? 'คลิกเลขกิจกรรมในแต่ละข้อเพื่อดูข้อความต้นฉบับจาก RAW' : 'ไฟล์ .md นี้ยังไม่มีส่วน Raw Data จึงเปิดข้อความต้นฉบับไม่ได้'}
        </p>
      </div>
    </div>
    <footer>NCX Cyber Exercise Evaluation Framework · รายงานประเมินผลคำตอบฉบับสมบูรณ์ ${esc(code)} (Onsite)</footer>
  </div>
  `);
  return fill(TPL.head, { __CODE__: esc(code), __NAME__: esc(ev.name) }) + o.join('') +
    fill(TPL.tail, { __SUMS__: JSON.stringify(sums), __DIST__: JSON.stringify(dist), __RAW__: JSON.stringify(acts).replace(/<\//g, '<\\/') });
}

// ── list page ──
const agencies = new Map();
async function load(files) {
  const errs = [];
  for (const f of files) {
    if (!f.name.endsWith('.md')) continue;
    try { const ev = parseMd(await f.text(), f.name); agencies.set(ev.code, ev); }
    catch (e) { errs.push(`${f.name}: ${e.message}`); }
  }
  document.getElementById('errs').textContent = errs.length ? 'ข้ามไฟล์: ' + errs.join(' · ') : '';
  render();
}
function render() {
  const list = [...agencies.values()].sort((a, b) => b.total - a.total || a.code.localeCompare(b.code));
  document.getElementById('sub').textContent = `${list.length} หน่วยงาน · คะแนนสมรรถนะหลัก 80 คะแนน (ยังไม่รวมคะแนนเข้าร่วม 20) · คลิกรหัสหน่วยงานเพื่อเปิดรายงาน`;
  document.getElementById('rows').innerHTML = list.map(a => {
    const band = grade(a.total / 4)[0];
    return `<tr data-q="${esc((a.code + ' ' + a.name).toLowerCase())}"><td><a href="#${encodeURIComponent(a.code)}">${esc(a.code)}</a></td><td>${esc(a.name)}</td>` +
      a.sums.map(s => `<td class="num">${s}</td>`).join('') +
      `<td class="num total">${a.total}</td><td><span class="band ${BAND[band]}">${band}</span></td></tr>`;
  }).join('');
}
function route() {  // #CODE opens that dashboard; browser back returns to the list
  const ev = agencies.get(decodeURIComponent(location.hash.slice(1)));
  const dash = document.getElementById('dash');
  dash.hidden = document.getElementById('back').hidden = !ev;
  document.getElementById('list').hidden = !!ev;
  if (ev) dash.srcdoc = buildHtml(ev); else dash.removeAttribute('srcdoc');
}
addEventListener('hashchange', route);
document.querySelectorAll('.drop input').forEach(i => i.onchange = () => load(i.files));
const drop = document.getElementById('drop');
addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
addEventListener('dragleave', () => drop.classList.remove('over'));
addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); load(e.dataTransfer.files); });
if (location.hash) history.replaceState(null, '', location.pathname);  // nothing loaded yet after a reload
</script>
</body></html>
